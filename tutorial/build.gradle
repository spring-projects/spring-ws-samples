plugins {
	id "samples.xjc"
}

xjc {
	source = file("src/main/resources/hr.xsd")
	packageName = "org.springframework.ws.samples.tutorial.schema"
}

dependencies {
	implementation("org.springframework.boot:spring-boot-starter-web-services")
	implementation("org.springframework.ws:spring-ws-support")
	implementation("jaxen:jaxen")
	implementation("org.jdom:jdom2")

	runtimeOnly("org.apache.ws.xmlschema:xmlschema-core")
	runtimeOnly("wsdl4j:wsdl4j")

	testImplementation("org.springframework.boot:spring-boot-starter-test")
}
